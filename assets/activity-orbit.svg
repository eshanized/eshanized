<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="title desc">
<title id="title">Engineering telemetry — Eshan Roy's GitHub activity</title>
<desc id="desc">An animated command-center visual connecting Eshan's open-source workstreams: M31A, Snigdha OS, Kyro, Octate and OpenMail.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08131f"/><stop offset=".58" stop-color="#0c1b2b"/><stop offset="1" stop-color="#151a32"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#38cdbd"/><stop offset="1" stop-color="#8df4df"/></linearGradient>
 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c1a7ff"/><stop offset="1" stop-color="#7057c7"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#39cfbe" stop-opacity=".2"/><stop offset="1" stop-color="#39cfbe" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#8ca5bc" stroke-opacity=".075"/></pattern>
 <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="290" rx="23" fill="url(#bg)"/>
<rect width="1200" height="290" rx="23" fill="url(#grid)"/>
<circle cx="950" cy="126" r="250" fill="url(#aura)"/>
<path d="M0 235H1200" stroke="#7893a9" stroke-opacity=".13"/>
<path d="M0 240C104 240 110 226 166 226S234 255 294 255 367 211 427 211 500 245 556 245 622 225 674 225 743 249 794 249 850 205 907 205 985 239 1044 239 1120 223 1200 223" fill="none" stroke="url(#cyan)" stroke-width="1.7" stroke-opacity=".82"/>
<path d="M0 240C104 240 110 226 166 226S234 255 294 255 367 211 427 211 500 245 556 245 622 225 674 225 743 249 794 249 850 205 907 205 985 239 1044 239 1120 223 1200 223" fill="none" stroke="#48dcca" stroke-width="8" stroke-opacity=".07" filter="url(#glow)"/>
<path d="M12 240H1188" stroke="#60ddcf" stroke-opacity=".18" stroke-dasharray="3 9"/>
<text x="48" y="49" fill="#64e5d5" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="3">GITHUB / ENGINEERING TELEMETRY</text>
<text x="46" y="111" fill="#f2f7fc" font-family="Arial,sans-serif" font-size="40" font-weight="700" letter-spacing="-1">THE WORK LEAVES A SIGNAL.</text>
<text x="49" y="145" fill="#9eb3c5" font-family="Arial,sans-serif" font-size="14">A living trace of experiments, systems, tools and ideas shipped in public.</text>
<rect x="49" y="173" width="193" height="25" rx="12.5" fill="#12313a" stroke="#4ed9ca" stroke-opacity=".45"/>
<circle cx="64" cy="185.5" r="3.5" fill="#68eedb" filter="url(#glow)"><animate attributeName="opacity" values=".25;1;.25" dur="2.4s" repeatCount="indefinite"/></circle>
<text x="76" y="189" fill="#b5f8ee" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1.4">PUBLIC CONTRIBUTION FEED</text>
<g fill="none" stroke-linecap="round">
 <circle cx="950" cy="120" r="105" stroke="#5bdaca" stroke-opacity=".22" stroke-width="1.2" stroke-dasharray="2 8"><animate attributeName="stroke-dashoffset" from="0" to="-80" dur="19s" repeatCount="indefinite"/></circle>
 <circle cx="950" cy="120" r="78" stroke="#ac95ff" stroke-opacity=".23" stroke-width="1.1" stroke-dasharray="46 12 4 12"><animate attributeName="stroke-dashoffset" from="0" to="80" dur="22s" repeatCount="indefinite"/></circle>
 <ellipse cx="950" cy="120" rx="134" ry="47" transform="rotate(-28 950 120)" stroke="#54d9d0" stroke-opacity=".3"/>
 <ellipse cx="950" cy="120" rx="134" ry="47" transform="rotate(48 950 120)" stroke="#927ce1" stroke-opacity=".24"/>
</g>
<circle cx="950" cy="120" r="40" fill="#102b38" stroke="#55dccc" stroke-opacity=".65"/>
<circle cx="950" cy="120" r="29" fill="none" stroke="#54dccc" stroke-opacity=".35" stroke-dasharray="3 5"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="9s" repeatCount="indefinite"/></circle>
<text x="950" y="116" text-anchor="middle" fill="#e9fffc" font-family="Arial,sans-serif" font-size="11" font-weight="700">BUILD</text>
<text x="950" y="132" text-anchor="middle" fill="#8fe7dc" font-family="Arial,sans-serif" font-size="9" letter-spacing="1">IN PUBLIC</text>
<g>
 <circle cx="862" cy="65" r="8" fill="#142c3e" stroke="#55dccc" stroke-width="1.6"/><circle cx="862" cy="65" r="3" fill="#68ebda"/>
 <circle cx="1053" cy="66" r="8" fill="#27203f" stroke="#b29aff" stroke-width="1.6"/><circle cx="1053" cy="66" r="3" fill="#c6b1ff"/>
 <circle cx="1087" cy="165" r="8" fill="#1b2c48" stroke="#8bc4ff" stroke-width="1.6"/><circle cx="1087" cy="165" r="3" fill="#a3d2ff"/>
 <circle cx="942" cy="224" r="8" fill="#3a292e" stroke="#f0b18d" stroke-width="1.6"/><circle cx="942" cy="224" r="3" fill="#ffc19b"/>
 <circle cx="819" cy="157" r="8" fill="#173538" stroke="#70dab8" stroke-width="1.6"/><circle cx="819" cy="157" r="3" fill="#8cf0ce"/>
 <g fill="#b9c9d8" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing=".8">
  <text x="840" y="48">M31A</text><text x="1035" y="45">SNIGDHA OS</text><text x="1100" y="169">KYRO</text><text x="930" y="249">OCTATE</text><text x="775" y="178">OPENMAIL</text>
 </g>
</g>
<circle r="4.5" fill="#e8fff9" filter="url(#glow)">
 <animateMotion dur="8s" repeatCount="indefinite" path="M0 0 C104 0 110 -14 166 -14 S234 15 294 15 367 -29 427 -29 500 5 556 5 622 -15 674 -15 743 9 794 9 850 -35 907 -35 985 -1 1044 -1 1120 -17 1200 -17"/>
</circle>
<text x="49" y="272" fill="#7f98ad" font-family="Arial,sans-serif" font-size="9" letter-spacing="1.8">IDEA → IMPLEMENTATION → ITERATION → RELEASE</text>
<text x="1151" y="272" text-anchor="end" fill="#7f98ad" font-family="Arial,sans-serif" font-size="9" letter-spacing="1.4">ESHANIZED / GH</text>
<rect x=".7" y=".7" width="1198.6" height="288.6" rx="22.3" fill="none" stroke="#6e8ba2" stroke-opacity=".22"/>
</svg>