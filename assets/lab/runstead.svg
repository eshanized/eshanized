 <radialGradient id="halo"><stop stop-color="#f2b36d" stop-opacity=".2"/><stop offset="1" stop-color="#f2b36d" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#91a7be" stroke-opacity=".07"/></pattern>
</defs>
<rect width="720" height="156" rx="18" fill="url(#bg)"/>
