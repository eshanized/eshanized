<text x="27" y="77" fill="#f2f6fb" font-family="Arial,sans-serif" font-size="29" font-weight="700">SLMGen</text>
<text x="29" y="103" fill="#a8bbcd" font-family="Arial,sans-serif" font-size="12">From raw data to small models.</text>
