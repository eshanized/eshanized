 <radialGradient id="halo"><stop stop-color="#b79aff" stop-opacity=".2"/><stop offset="1" stop-color="#b79aff" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#91a7be" stroke-opacity=".07"/></pattern>
</defs>
<rect width="720" height="156" rx="18" fill="url(#bg)"/>
<rect width="720" height="156" rx="18" fill="url(#grid)"/>
<circle cx="480" cy="78" r="126" fill="url(#halo)"/>
<path d="M0 126C150 80 245 162 370 125S573 86 720 116" fill="none" stroke="url(#accent)" stroke-opacity=".22" stroke-width="1.3"/>
<path d="M0 136C150 90 245 172 370 135S573 96 720 126" fill="none" stroke="url(#accent)" stroke-opacity=".1"/>
