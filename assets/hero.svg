<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Eshan Roy — Systems, AI and open source</title><desc id="desc">An animated dark technology banner with a glowing code workspace, orbital arcs and Eshan Roy's engineering identity.</desc>
<defs>
