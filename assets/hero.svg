<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Eshan Roy — Systems, AI and open source</title>
<desc id="desc">An animated dark technology banner featuring a glowing code workspace, orbital arcs and the identity of Eshan Roy.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111d"/><stop offset=".55" stop-color="#0b1725"/><stop offset="1" stop-color="#111a31"/></linearGradient>
  <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#60f1dc"/><stop offset="1" stop-color="#187b91"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d0b7ff"/><stop offset="1" stop-color="#7657d8"/></linearGradient>
  <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6b5ad8" stop-opacity=".0"/><stop offset=".42" stop-color="#44e2d0" stop-opacity=".8"/><stop offset=".72" stop-color="#a18aff" stop-opacity=".8"/><stop offset="1" stop-color="#6b5ad8" stop-opacity=".05"/></linearGradient>
  <radialGradient id="planet"><stop stop-color="#4fe7d2" stop-opacity=".24"/><stop offset=".7" stop-color="#237e9c" stop-opacity=".12"/><stop offset="1" stop-color="#0a1727" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#8ba6be" stroke-opacity=".08" stroke-width="1"/></pattern>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
  <style>
    .label{font:700 12px 'Inter',Arial,sans-serif;letter-spacing:3px;fill:#73e8d9}
    .name{font:700 62px 'Inter',Arial,sans-serif;letter-spacing:-2px;fill:#f4f8fc}
    .sub{font:500 17px 'Inter',Arial,sans-serif;letter-spacing:2px;fill:#bfd0df}
    .micro{font:12px 'Inter',Arial,sans-serif;fill:#849db2}
    .pane{fill:#0b192a;fill-opacity:.82;stroke:#68d9d5;stroke-opacity:.5;stroke-width:1.4}
    .float{animation:float 7s ease-in-out infinite}
    .pulse{animation:pulse 3.8s ease-in-out infinite}
    .dash{stroke-dasharray:8 13;animation:dash 18s linear infinite}
    .scan{animation:scan 8s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
    @keyframes pulse{0%,100%{opacity:.42}50%{opacity:1}}
    @keyframes dash{to{stroke-dashoffset:-260}}
    @keyframes scan{0%,100%{opacity:.12;transform:translateX(-18px)}50%{opacity:.65;transform:translateX(18px)}}
  </style>
</defs>
<rect width="1200" height="430" rx="25" fill="url(#bg)"/>
<rect width="1200" height="430" rx="25" fill="url(#grid)"/>
<circle cx="1020" cy="158" r="260" fill="url(#planet)"/>
<path d="M0 80C148 164 195 4 326 -16" fill="none" stroke="url(#violet)" stroke-opacity=".4" stroke-width="46" filter="url(#soft)"/>
<path d="M-35 300C155 214 284 354 462 342S786 388 968 303 1120 252 1240 284" fill="none" stroke="url(#ribbon)" stroke-width="2.5"/>
<path d="M-25 323C165 238 275 376 465 365S787 405 969 326 1124 275 1235 302" fill="none" stroke="url(#ribbon)" stroke-opacity=".5" stroke-width="1.1"/>
<path d="M-20 335C155 255 296 390 473 379S797 420 978 343 1126 291 1230 318" fill="none" stroke="#78dccc" stroke-opacity=".12" stroke-width="1"/>
<g opacity=".45" fill="none" stroke="#49dccc"><path d="M700 90A188 150 0 0 1 1088 86" stroke-opacity=".5"/><path d="M730 107A160 125 0 0 1 1055 103" stroke-opacity=".22"/></g>
<circle cx="923" cy="115" r="178" fill="none" stroke="#5ce5d5" stroke-opacity=".4" stroke-width="1.2" stroke-dasharray="2 13" class="dash"/>
<circle cx="923" cy="115" r="164" fill="none" stroke="#a48aff" stroke-opacity=".25" stroke-width="1"/>
<circle cx="1053" cy="82" r="7" fill="#64f4df" filter="url(#glow)" class="pulse"/>
<circle cx="790" cy="201" r="5" fill="#b99aff" filter="url(#glow)" class="pulse"/>
<circle cx="997" cy="275" r="4" fill="#64f4df" filter="url(#glow)" class="pulse"/>
<g>
  <rect x="54" y="79" width="36" height="36" rx="11" fill="#12323b" stroke="#58e8d8" stroke-opacity=".8"/>
  <path d="M72 87v20M62 97h20" stroke="#d7fff8" stroke-width="2" stroke-linecap="round"/>
  <text x="107" y="102" class="label">INDEPENDENT ENGINEERING</text>
  <text x="52" y="190" class="name">ESHAN ROY</text>
  <text x="56" y="232" class="sub">SYSTEMS  /  AI  /  OPEN SOURCE</text>
  <text x="57" y="267" class="micro">Founder &amp; CEO · Tonmoy Infrastructure &amp; Vision</text>
  <rect x="57" y="294" width="222" height="3" rx="2" fill="#243a4d"/>
  <rect x="57" y="294" width="222" height="3" rx="2" fill="url(#teal)" class="scan"/>
  <text x="57" y="326" class="micro">BUILDING TOOLS, RUNTIMES AND INFRASTRUCTURE.</text>
</g>
<g class="float">
  <rect x="768" y="144" width="352" height="205" rx="17" class="pane"/>
  <path d="M768 184H1120" stroke="#79d8dc" stroke-opacity=".3"/>
  <circle cx="791" cy="164" r="5" fill="#ff7f91"/><circle cx="809" cy="164" r="5" fill="#ffd27a"/><circle cx="827" cy="164" r="5" fill="#5fe0bd"/>
  <rect x="791" y="207" width="56" height="7" rx="3.5" fill="#47728a"/>
  <rect x="791" y="229" width="40" height="7" rx="3.5" fill="#47728a" opacity=".7"/>
  <rect x="791" y="251" width="49" height="7" rx="3.5" fill="#47728a" opacity=".55"/>
  <rect x="876" y="207" width="94" height="8" rx="4" fill="#38cbbb"/>
  <rect x="984" y="207" width="52" height="8" rx="4" fill="#9179e7"/>
  <rect x="876" y="234" width="156" height="8" rx="4" fill="#368b9b"/>
  <rect x="876" y="261" width="120" height="8" rx="4" fill="#8873d9"/>
  <rect x="876" y="288" width="74" height="8" rx="4" fill="#38cbbb"/>
  <path d="M876 316H1086" stroke="#45667e" stroke-opacity=".6" stroke-width="2" stroke-linecap="round"/>
  <path d="M876 316H1018" stroke="#58e4d3" stroke-width="2.5" stroke-linecap="round" class="dash"/>
</g>
<g class="float" style="animation-delay:-2s">
  <rect x="1080" y="48" width="86" height="74" rx="12" fill="#111f34" fill-opacity=".9" stroke="#927ee5" stroke-opacity=".65"/>
  <path d="M1094 97C1109 87 1114 104 1127 79S1148 92 1154 68" fill="none" stroke="url(#violet)" stroke-width="3" stroke-linecap="round"/>
  <path d="M1094 105H1152" stroke="#59718b" stroke-opacity=".5"/>
</g>
<g class="float" style="animation-delay:-3.5s">
  <rect x="703" y="258" width="84" height="78" rx="13" fill="#102333" fill-opacity=".9" stroke="#58e5d4" stroke-opacity=".7"/>
  <path d="M745 272l23 13-23 13-23-13z" fill="url(#teal)" fill-opacity=".9"/>
  <path d="M722 296l23 13 23-13M722 308l23 13 23-13" fill="none" stroke="url(#violet)" stroke-width="2"/>
</g>
<path d="M0 0H1200V430H0Z" fill="none" stroke="#6d879e" stroke-opacity=".18" stroke-width="2"/>
</svg>