<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Eshan's engineering domains</title><desc id="desc">Autonomous AI, Linux ecosystems, developer tools, and infrastructure connected by systems thinking.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1422"/><stop offset="1" stop-color="#101b2b"/></linearGradient>
 <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4ce4d0"/><stop offset="1" stop-color="#197f91"/></linearGradient>
 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b9a3ff"/><stop offset="1" stop-color="#7154c8"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#89c7ff"/><stop offset="1" stop-color="#3879bc"/></linearGradient>
 <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb38a"/><stop offset="1" stop-color="#d76d79"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#8ba2ba" stroke-opacity=".08"/></pattern>
 <style>
 .card{fill:#111f30;stroke:#263d54;stroke-width:1.4}.muted{fill:#92a8bb;font:15px 'Inter',Arial,sans-serif}.heading{fill:#edf5fb;font:700 22px 'Inter',Arial,sans-serif}.tag{fill:#a7bfd1;font:12px 'Inter',Arial,sans-serif;letter-spacing:1.6px}.node{animation:breathe 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.wire{stroke-dasharray:7 11;animation:flow 15s linear infinite}@keyframes breathe{0%,100%{opacity:.65;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}@keyframes flow{to{stroke-dashoffset:-180}}
 </style>
</defs>
<rect width="1200" height="430" rx="26" fill="url(#bg)"/><rect width="1200" height="430" rx="26" fill="url(#grid)"/>
<text x="56" y="57" class="tag">THE ENGINEERING MAP</text><text x="56" y="91" fill="#f1f7fb" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">Four domains. One systems mindset.</text>
<g fill="none" stroke-width="2" opacity=".65"><path class="wire" d="M600 224C480 150 390 150 300 174" stroke="#4ce4d0"/><path class="wire" d="M600 224C720 150 810 150 900 174" stroke="#b9a3ff"/><path class="wire" d="M600 224C480 300 390 300 300 286" stroke="#89c7ff"/><path class="wire" d="M600 224C720 300 810 300 900 286" stroke="#ffb38a"/></g>
<g transform="translate(62 125)"><rect class="card" width="340" height="112" rx="18"/><circle cx="54" cy="56" r="25" fill="#163b3d"/><g stroke="url(#teal)" stroke-width="2.6" fill="none" stroke-linecap="round"><path d="M42 56h24M54 44v24M46 48l16 16M62 48L46 64"/><circle cx="54" cy="56" r="17" opacity=".45"/></g><text x="96" y="48" class="heading">Autonomous AI</text><text x="96" y="75" class="muted">Agents · runtimes · evaluation</text><circle class="node" cx="314" cy="20" r="4" fill="#4ce4d0" filter="url(#glow)"/></g>
<g transform="translate(798 125)"><rect class="card" width="340" height="112" rx="18"/><circle cx="54" cy="56" r="25" fill="#2b2349"/><g stroke="url(#violet)" stroke-width="2.5" fill="none" stroke-linejoin="round"><path d="M54 38l17 9v18l-17 9-17-9V47zM37 47l17 9 17-9M54 56v18"/></g><text x="96" y="48" class="heading">Linux ecosystems</text><text x="96" y="75" class="muted">OS · desktop · packaging</text><circle class="node" cx="314" cy="20" r="4" fill="#b9a3ff" filter="url(#glow)" style="animation-delay:-1s"/></g>
<g transform="translate(62 250)"><rect class="card" width="340" height="112" rx="18"/><circle cx="54" cy="56" r="25" fill="#1d3048"/><g stroke="url(#blue)" stroke-width="2.5" fill="none" stroke-linecap="round"><path d="M47 45l-11 11 11 11M61 45l11 11-11 11M57 41l-6 30"/></g><text x="96" y="48" class="heading">Developer tools</text><text x="96" y="75" class="muted">Code intelligence · DX</text><circle class="node" cx="314" cy="20" r="4" fill="#89c7ff" filter="url(#glow)" style="animation-delay:-2s"/></g>
<g transform="translate(798 250)"><rect class="card" width="340" height="112" rx="18"/><circle cx="54" cy="56" r="25" fill="#3b2930"/><g stroke="url(#coral)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M38 48l16-9 16 9v19l-16 9-16-9zM38 48l16 10 16-10M54 58v18"/></g><text x="96" y="48" class="heading">Infrastructure</text><text x="96" y="75" class="muted">Platforms · operations · trust</text><circle class="node" cx="314" cy="20" r="4" fill="#ffb38a" filter="url(#glow)" style="animation-delay:-3s"/></g>
<g transform="translate(540 172)"><circle cx="60" cy="52" r="54" fill="#102b38" stroke="#2b6570" stroke-width="1.5"/><circle cx="60" cy="52" r="43" fill="none" stroke="#4ce4d0" stroke-opacity=".4" stroke-dasharray="4 7"/><text x="60" y="48" text-anchor="middle" fill="#e9fffc" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700">SYSTEMS</text><text x="60" y="66" text-anchor="middle" fill="#8fe7dc" font-family="Inter,Arial,sans-serif" font-size="10">THINKING</text><circle class="node" cx="60" cy="-1" r="4" fill="#4ce4d0" filter="url(#glow)"/></g>
</svg>